<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LearnUp</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Century Gothic", system-ui, sans-serif;
        background: #f7fbf8;
        color: #1a2332;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(207, 234, 213, 0.72)),
          #f7fbf8;
      }

      main {
        max-width: 320px;
        border: 1px solid rgba(90, 158, 120, 0.22);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.86);
        padding: 24px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(26, 35, 50, 0.1);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: #5f6f7f;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>LearnUp</h1>
      <p>Connexion à l'application...</p>
    </main>
  </body>
</html>
